- id: scaffold
  title: 'Scaffold: Support Graph Theory Based Sparsification for Graph Neural Networks'
  authors: <strong>Siddhartha Shankar Das</strong>, Sai Karthik Navuluru, S M Ferdous, Ryan A. Rossi, Baris Coskunuzer,
    Lakshman Tamil, Edoardo Serra, Alex Pothen, Robert Rallo, and Mahantesh M Halappanavar
  venue: arXiv:2609.31466
  year: 2026
  category: preprint
  summary: An unsupervised sparsification framework that controls the length of rerouted communication paths and
    the load they place on retained edges. Across 19 benchmarks, sparse supports retain 10–50% of edges while recovering
    or closely approaching full-graph GNN performance.
  links:
