- id: sgs-gnn
  title: 'SGS-GNN: A Supervised Graph Sparsifier for Graph Neural Networks'
  authors: <strong>Siddhartha Shankar Das</strong>, Naheed Anjum Arafat, Muftiqur Rahman, S M Ferdous, Alex Pothen,
    Mahantesh Halappanavar, and Danda B. Rawat
  venue: Proceedings of the 32nd ACM SIGKDD Conference on Knowledge Discovery and Data Mining V.2, pp. 755–766
  year: 2026
  category: conference
  summary: Learn which graph edges matter for a downstream prediction task. SGS-GNN trains an edge probability model
    and a GNN together to sample compact, task-relevant subgraphs, reducing memory requirements while preserving
    predictive signal.
