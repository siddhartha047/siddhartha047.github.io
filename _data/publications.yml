- id: unifying
  title: Unifying Graph Neural Networks Through a Common Layer Equation
  authors: Sai Karthik Navuluru, <strong>Siddhartha Shankar Das</strong>, Bo Ni, Hongjie Chen, Yu Wang, Baris Coskunuzer,
    Nesreen K. Ahmed, Franck Dernoncourt, Mahantesh Halappanavar, Tyler Derr, Ryan A. Rossi, and Lakshman Tamil
  venue: arXiv:2608.16097
  year: 2026
  category: preprint
  summary: A common layer equation organizes more than 200 GNN architectures into seven components. Separating propagation
    from message transformation makes architectural similarities explicit and supports component-level comparison,
    theoretical analysis, and architecture generation.
