- id: edis
  title: 'EDiS: Edge Disjoint Subgraph Sparsification Framework for Graph Neural Networks'
  authors: Sai Karthik Navuluru, <strong>Siddhartha Shankar Das</strong>, Franck Dernoncourt, S M Ferdous, Ryan
    A. Rossi, Nesreen K. Ahmed, Baris Coskunuzer, Alex Pothen, Lakshman Tamil, and Mahantesh M Halappanavar
  venue: arXiv:2610.09059
  year: 2026
  category: preprint
  summary: Decompose a graph once, then reuse cached edge-disjoint subgraphs to compose a different sparse training
    graph each epoch. EDiS separates structural extraction from epoch-level sampling and evaluates this approach
    across 19 node classification benchmarks.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2610.09059
