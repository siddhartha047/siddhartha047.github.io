areas:
- id: graphs
  number: '01'
  title: Graph learning at scale
  description: How much of a graph do we need to learn well? I design sampling and sparsification algorithms that
    retain useful structural and attribute information while reducing computational and memory costs.
  detail: My work spans supervised edge selection, support graph theory, and reusable edge-disjoint decompositions,
    with attention to both homophilic and heterophilic graphs.
  publications:
  - sgs-gnn
  - scaffold
  - edis
  - ags-gnn
  - unifying
  keywords:
  - Graph neural networks
  - Sparsification
  - Scalable learning
- id: systems
  number: '02'
  title: Learning for system design
  description: I use graph representations and learning-based optimization to connect computation structure with
    hardware and software design decisions.
  detail: Current directions include differentiable hardware/software partitioning and scheduling, reinforcement
    learning for joint optimization, and graph-based circuit equivalence checking.
  publications:
  - diff-gnn
  - hw-sw-rl
  keywords:
  - Hardware/software co-design
  - Scheduling
  - Circuit learning
- id: security
  number: '03'
  title: AI for cybersecurity
  description: I develop language-model and knowledge-graph methods that connect vulnerabilities, weaknesses, attack
    patterns, and adversary behavior.
  detail: The aim is to make fragmented security knowledge easier to analyze at scale, from hierarchical vulnerability
    classification to threat intelligence and risk prioritization.
  publications:
  - v2w-bert
  - vwc-map
  - vwc-bert
  - attack2cve
  keywords:
  - Language models
  - Threat intelligence
  - Knowledge graphs
- id: documents
  number: '04'
  title: Multimodal & agentic AI
  description: I build AI systems that extract, organize, and retrieve information from large collections of scientific
    and regulatory documents.
  detail: Projects include the NEPATEC corpus, multimodal metadata extraction, map-based georeferencing, and retrieval-augmented
    assistants for environmental permitting.
  publications:
  - nepatec
  keywords:
  - Document intelligence
  - Multimodal LLMs
  - Retrieval-augmented generation
- id: optimization
  number: '05'
  title: Multi-objective & many-objective optimization
  description: I design evolutionary algorithms for problems with multiple competing objectives, with a particular
    focus on many-objective optimization and the balance between convergence toward the Pareto front and diversity
    among solutions.
  detail: My work includes F-DEA, which combines adaptive fuzzy dominance with reference-point guidance, and a
    fuzzy-dominance approach with bidirectional bias developed in my undergraduate thesis. I also apply many-objective
    methods to computing-cluster performance and scheduling, including hybrid greedy and nondominated sorting
    approaches. This research formed the basis of my M.Sc. and B.Sc. work at BUET, advised by Md. Monirul Islam.
  publications:
  - fdea
  - greedy-nsga
  - cluster
  keywords:
  - Multi-objective optimization
  - Many-objective optimization
  - Evolutionary algorithms
  - Fuzzy dominance
  - Pareto convergence & diversity
