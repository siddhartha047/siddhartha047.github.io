summary: Siddhartha Shankar Das is a Postdoctoral Researcher at Pacific Northwest National Laboratory. His research focuses on scalable graph learning, graph neural networks, graph sparsification, cybersecurity, scientific AI, and high-performance computing. His work develops efficient machine learning and graph algorithms for large-scale scientific and security applications.
bio:
  - Siddhartha Shankar Das is a Postdoctoral Researcher at Pacific Northwest National Laboratory. His research focuses on scalable graph learning, graph neural networks, graph sparsification, cybersecurity, scientific AI, and high-performance computing. His work develops efficient machine learning and graph algorithms for large-scale scientific and security applications.
  - He also works on hardware/software partitioning and circuit representation learning, with an emphasis on scalable methods that connect graph structure, systems constraints, and domain knowledge to practical scientific and security workloads.
