name: Siddhartha Shankar Das
role: Postdoctoral Researcher
affiliation: Pacific Northwest National Laboratory
summary: Postdoctoral researcher at Pacific Northwest National Laboratory working on graph neural networks, graph
  sparsification, AI for system design, cybersecurity, and multimodal document intelligence.
bio:
- I am a Postdoctoral Researcher at <a href="https://www.pnnl.gov/people/siddhartha-shankar-das">Pacific Northwest
  National Laboratory (PNNL)</a>, in the Language Intelligence group within the Data Science and Machine Intelligence
  department. I work at the intersection of graph algorithms, machine learning, and scalable AI systems.
- My research develops graph neural networks and sparsification methods for large, complex graphs, including homophilic
  and heterophilic networks. I also study learning for hardware/software partitioning, scheduling, circuit representation,
  and equivalence checking.
- At PNNL, I build LLM-based, multimodal, and agentic systems for document intelligence, retrieval-augmented generation,
  georeferencing, and decision support. My cybersecurity research connects software vulnerabilities, weaknesses,
  and attack patterns through language models and knowledge graphs.
- I received my Ph.D. in Computer Science from <a href="https://www.cs.purdue.edu/">Purdue University</a> in May
  2025, advised by <a href="https://www.cs.purdue.edu/homes/apothen/">Alex Pothen</a>. I earned my M.Sc. and B.Sc.
  in Computer Science and Engineering at BUET, advised by Md. Monirul Islam, and previously served as a Lecturer
  and Assistant Professor in BUET’s CSE department.
- During three summer internships at PNNL (2019–2021), I worked with Mahantesh Halappanavar on language models for
  vulnerability analysis. This work received the DSAA 2021 Best Application Paper Award and the HST 2022 Best Paper
  Award.
research_focus:
- Multi-objective & many-objective optimization
- Graph neural networks
- Graph sparsification
- AI for system design
- Cybersecurity AI
- Multimodal & agentic AI
