<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% seo %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "{{ site.data.profile.name }}",
        "jobTitle": "{{ site.data.profile.role }}",
        "worksFor": {
          "@type": "Organization",
          "name": "{{ site.data.profile.affiliation }}"
        },
        "url": "{{ site.url }}",
        "sameAs": [
          {% for link in site.data.profile.links %}
          "{{ link.url }}"{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ],
        "description": "{{ site.data.profile.summary }}"
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
        <nav class="site-nav" aria-label="Primary navigation">
          {% for item in site.data.navigation.items %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>

    <main class="wrap page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>&copy; {{ site.data.profile.name }}</p>
        <p>Built with Jekyll and hosted on GitHub Pages.</p>
      </div>
    </footer>
  </body>
</html>
